<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado de Pago - BeatPay Virtual</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen flex items-center justify-center">
    <div class="bg-[#181818] p-8 rounded-xl shadow-2xl w-full max-w-md border border-[#282828] text-center">
        <h1 class="text-2xl font-bold mb-4">Resultado de la Transacción</h1>
        
        {% if exito %}
            <div class="bg-green-900/50 border border-green-500 text-green-300 p-4 rounded mb-6">{{ exito }}</div>
            <p class="text-sm text-gray-300 mb-6">Nuevo saldo en tarjeta: <strong class="text-white">${{ tarjeta.saldo }} CLP</strong></p>
        {% endif %}

        {% if error %}
            <div class="bg-red-900/50 border border-red-500 text-red-300 p-4 rounded mb-6">{{ error }}</div>
            <a href="{% url 'cargar_fondos' %}" class="block bg-yellow-500 hover:bg-yellow-400 text-black font-bold p-3 rounded mb-4">💵 Ir a Cargar Fondos</a>
        {% endif %}

        <a href="{% url 'dashboard' %}" class="block bg-[#282828] hover:bg-[#383838] text-white p-3 rounded">Volver al Dashboard</a>
    </div>
</body>
</html>
